<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Not Found | Vipin Gupta</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23F26B5B'/><text x='50' y='68' font-size='50' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23ffffff'>VG</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFF8E0;
            --surface: #FFFEF8;
            --ink: #4A4540;
            --muted: #6A645E;
            --coral: #3E7151;
            --coral-dark: #346044;
            --border: #F0E6C8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            text-align: center;
        }
        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--ink);
            text-decoration: none;
        }
        .logo span {
            color: var(--coral);
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            margin: auto;
        }
        .badge {
            display: inline-block;
            background: rgba(242, 107, 91, 0.1);
            color: var(--coral);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--ink);
        }
        p {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--coral);
            color: #FFFFFF;
        }
        .btn-primary:hover {
            background: var(--coral-dark);
        }
        .btn-secondary {
            background: var(--bg);
            color: var(--ink);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: #F4EFE6;
        }
        .footer {
            font-size: 0.8rem;
            color: var(--muted);
            padding: 16px 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">Vipin<span>.</span></a>
    </header>

    <main class="card">
        <span class="badge">Error 404</span>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or may have been moved. Let's get you back to the portfolio.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">Back to Portfolio</a>
            <a href="/resume/" class="btn btn-secondary">View Resume</a>
        </div>
    </main>

    <footer class="footer">
        &copy; <span id="year"></span> Vipin Gupta
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
